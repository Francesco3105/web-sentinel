{% extends "base.html" %}
{% block title %}Accesso{% endblock %}
{% block content %}
<section class="card login">
  <img class="login-logo" src="{{ url_for('static', path='img/logo.svg') }}" alt="Web Sentinel" width="72" height="81">
  <h1>Accesso</h1>
  {% if error %}<p class="flash flash-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="email">Utente</label>
      <input id="email" name="email" type="text" value="{{ email or '' }}" autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Entra</button>
  </form>
</section>
{% endblock %}
