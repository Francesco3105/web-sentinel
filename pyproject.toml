[project]
name = "web-sentinel"
version = "0.1.0"
description = "Internal website monitoring tool"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["app/db/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
